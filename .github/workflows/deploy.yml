name: Deploy to DreamHost FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: horsey/ # TARGET DIRECTORY ON DREAMHOST
        # Default local-dir is root (.), which includes index.html, levels.js etc.
        exclude: |
          **/.git*
          **/.claude*
          **/node_modules/**
          **/brain/**
          scores.json
          Dockerfile
          Makefile
          package-lock.json
