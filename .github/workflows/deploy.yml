name: Deploy to DreamHost FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: 📂 SFTP Deploy
      uses: wlixcc/SFTP-Deploy-action@v1.2.4
      with:
        username: ${{ secrets.FTP_USERNAME }}
        server: ${{ secrets.FTP_SERVER }}
        password: ${{ secrets.FTP_PASSWORD }}
        local_path: './'
        remote_path: 'horsey/' # TARGET DIRECTORY ON DREAMHOST
        # Note: Depending on your server setup, you might need the full path
        # like: /home/your_user/your_domain.com/horsey/
        args: '-o ConnectTimeout=10'
