<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>HORSEY CONDITION</title>
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #05000F;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      display: block;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }

    /* Virtual Controls */
    #controls {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: none;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 40px 20px 40px;
      pointer-events: none;
      z-index: 100;
      user-select: none;
    }

    .joy-area {
      width: 140px;
      height: 100px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(0, 255, 255, 0.2);
      border-radius: 10px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .joy-knob {
      width: 50px;
      height: 50px;
      background: rgba(0, 255, 255, 0.2);
      border: 2px solid #00FFFF;
      border-radius: 50%;
      pointer-events: none;
      transition: transform 0.1s ease-out;
    }

    .btn-jump {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.1);
      border: 3px solid #FF2D78;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FF2D78;
      font-size: 32px;
      font-weight: bold;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-jump:active {
      background: rgba(255, 45, 120, 0.3);
      transform: scale(0.9);
    }

    #btn-start,
    #btn-restart {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 60px;
      background: #00FFFF;
      color: #05000F;
      border: none;
      border-radius: 30px;
      font-family: "Courier New", monospace;
      font-size: 20px;
      font-weight: bold;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 101;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
      pointer-events: auto;
      user-select: none;
    }

    #btn-restart {
      background: #FF2D78;
      box-shadow: 0 0 20px rgba(255, 45, 120, 0.5);
      color: #FFF;
    }

    #btn-settings {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(0, 255, 255, 0.5);
      border-radius: 10px;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 101;
      pointer-events: auto;
      color: #00FFFF;
      font-size: 24px;
      user-select: none;
    }

    /* Hidden input for mobile keyboard */
    #mobile-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <input type="text" id="mobile-input" maxlength="16" autocorrect="off" autocapitalize="characters">
  <div id="btn-start">START GAME</div>
  <div id="btn-restart">RESTART</div>
  <div id="btn-settings">⚙</div>
  <div id="controls">
    <div id="joy-base" class="joy-area">
      <div id="joy-knob" class="joy-knob"></div>
    </div>
    <div id="btn-jump" class="btn-jump">↑</div>
  </div>
  <script src="./levels.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    canvas.width = 800;
    canvas.height = 450;

    // ── constants ─────────────────────────────────────────────
    const GRAVITY = 0.28;
    const JUMP_VY = -9.2;
    const SPEED = 3.0;
    const W = canvas.width, H = canvas.height;

    // ALL_LEVELS loaded from levels.js
    let currentLevel = ALL_LEVELS[0];

    // ── level data helpers ────────────────────────────────────
    let COINS = [], GOAL = null;
    function buildLevelData() {
      COINS = currentLevel.coins.map(cx => {
        const p = currentLevel.platforms.find(p => cx >= p[0] && cx <= p[0] + p[2]);
        return { x: cx, y: p ? p[1] - 22 : 200, r: 7, collected: false };
      });
      GOAL = currentLevel.goal;
    }

    // ── state ─────────────────────────────────────────────────
    let player, enemies, cameraX, cameraY, score, phase, tick;
    let horseTrail = [];
    const RAINBOW = ['#FF0000', '#FF6600', '#FFFF00', '#00FF44', '#00AAFF', '#8833FF', '#FF44CC'];
    let username = '';
    let scores = { highScores: [], fastTimes: [] };
    let startTime = null;
    let timerActive = false;
    let finalTime = 0;
    let hasPlayed = false;
    let playingLevelIdx = 0;
    let isFullRun = false;
    let tookSecretPath = false;
    let runScore = 0;
    let runTime = 0;

    // ── settings ──────────────────────────────────────────────
    const settings = {
      enemyRespawn: false,
      levelIdx: 0,
      rainbowTrail: true,
      unicornHorn: true,
      highQualityFX: true,
    };
    const SETTINGS_OPTS = [
      { label: 'Level', key: 'levelIdx', type: 'cycle', options: ALL_LEVELS.map(l => l.name) },
      { label: 'Enemy Respawn', key: 'enemyRespawn', type: 'toggle' },
      { label: 'High Quality FX', key: 'highQualityFX', type: 'toggle' },
      { label: 'Rainbow Trail', key: 'rainbowTrail', type: 'toggle' },
      { label: 'Unicorn Horn', key: 'unicornHorn', type: 'toggle' },
    ];
    let settingsCursor = 0;
    let settingsPrevPhase = 'lobby';

    function getSettingsKey() {
      return `lvl:${currentLevel.id}|er:${settings.enemyRespawn ? 1 : 0}`;
    }

    function getRunKey(secret) {
      return `${secret ? 'run:secret' : 'run:all'}|er:${settings.enemyRespawn ? 1 : 0}`;
    }

    // ── server I/O ────────────────────────────────────────────
    async function fetchScores() {
      try {
        let key;
        if (settings.levelIdx === 0) key = getRunKey(false);
        else if (settings.levelIdx === ALL_LEVELS.length - 1) key = getRunKey(true);
        else key = `lvl:${ALL_LEVELS[settings.levelIdx].id}|er:${settings.enemyRespawn ? 1 : 0}`;
        const res = await fetch(`scores.php?key=${encodeURIComponent(key)}`);
        const data = await res.json();
        if (data && data.highScores && data.fastTimes) scores = data;
      } catch { /* no server (opened as file) */ }
    }

    async function submitScore(finished = true) {
      try {
        const res = await fetch('scores.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: username, score, time: finalTime, finished, settingsKey: getSettingsKey() }),
        });
        const data = await res.json();
        if (data && data.highScores && data.fastTimes) scores = data;
      } catch { /* offline */ }
    }

    async function submitRunScore(secret) {
      try {
        await fetch('scores.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: username, score: runScore, time: runTime, finished: true, settingsKey: getRunKey(secret) }),
        });
      } catch { /* offline */ }
    }

    // ── helpers ───────────────────────────────────────────────
    function formatTime(ms) {
      const m = Math.floor(ms / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      const msPart = Math.floor(ms % 1000);
      return `${m}:${String(s).padStart(2, '0')}.${String(msPart).padStart(3, '0')}`;
    }

    function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    function glow(color, blur, fn) {
      if (!settings.highQualityFX) {
        fn();
        return;
      }
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = blur;
      fn();
      ctx.restore();
    }

    // ── init ──────────────────────────────────────────────────
    function initPlay() {
      playingLevelIdx = settings.levelIdx;
      isFullRun = (settings.levelIdx === 0);
      tookSecretPath = false;
      runScore = 0;
      runTime = 0;
      startLevel(playingLevelIdx);
      hasPlayed = true;
    }

    function startLevel(idx) {
      currentLevel = ALL_LEVELS[idx];
      buildLevelData();
      player = { x: 80, y: 340, w: 20, h: 26, vx: 0, vy: 0, onGround: false, hp: 5, iframes: 0, facing: 1 };
      horseTrail = [];
      enemies = currentLevel.enemies.map(def => {
        const p = currentLevel.platforms[def.platIdx];
        return {
          x: def.startX, y: p[1] - 22, w: 18, h: 22,
          vx: def.speed, speed: def.speed, platIdx: def.platIdx,
          startX: def.startX, dead: false, respawnIn: 0
        };
      });
      cameraX = 0;
      cameraY = 0;
      score = 0;
      phase = 'play';
      startTime = null;
      timerActive = false;
      finalTime = 0;
    }

    function winLevel(secret = false) {
      finalTime = timerActive ? Date.now() - startTime : 0;
      score += player.hp * 5;
      if (isFullRun) { runScore += score; runTime += finalTime; }
      submitScore(true);

      const isL6 = playingLevelIdx === 5;
      const isL7 = playingLevelIdx === 6;

      if (secret && isL6) {
        tookSecretPath = true;
        phase = 'secretwin';
      } else if (isL6 || isL7) {
        if (isFullRun) submitRunScore(tookSecretPath);
        phase = 'win';
      } else {
        phase = 'nextlevel';
      }
    }

    function killPlayer() {
      if (phase !== 'play') return;
      finalTime = timerActive ? Date.now() - startTime : 0;
      phase = 'dead';
      submitScore(false);
    }

    function hurtPlayer(enemy) {
      if (player.iframes > 0) return;
      player.hp--;
      player.iframes = 90;
      const dir = player.x + player.w / 2 < enemy.x + enemy.w / 2 ? -1 : 1;
      player.vx = dir * 5;
      player.vy = -4;
      player.onGround = false;
      if (player.hp <= 0) killPlayer();
    }

    // ── input ─────────────────────────────────────────────────
    const keys = {};
    const MOVE_KEYS = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'KeyA', 'KeyD', 'KeyW', 'Space']);

    window.addEventListener('keydown', e => {
      if (['Space', 'ArrowUp', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();

      // Lobby: handle username entry
      if (phase === 'lobby') {
        if (e.code === 'Enter' && username.trim().length > 0) {
          initPlay();
        } else if (e.code === 'Backspace') {
          username = username.slice(0, -1);
        } else if (e.key.length === 1 && username.length < 16) {
          username += e.key.toUpperCase();
        }
        // Allow settings toggle in lobby
      }

      // Settings toggle
      if (e.code === 'Escape' || e.code === 'Tab') {
        if (phase === 'settings') {
          phase = settingsPrevPhase;
          if (phase === 'lobby') fetchScores();
        } else if (phase === 'lobby' || phase === 'play') {
          settingsPrevPhase = phase;
          phase = 'settings';
        }
        return;
      }

      // Settings input handling
      if (phase === 'settings') {
        if (e.code === 'ArrowUp' || e.code === 'KeyW') settingsCursor = (settingsCursor - 1 + SETTINGS_OPTS.length) % SETTINGS_OPTS.length;
        if (e.code === 'ArrowDown' || e.code === 'KeyS') settingsCursor = (settingsCursor + 1) % SETTINGS_OPTS.length;
        if (e.code === 'ArrowRight' || e.code === 'Space' || e.code === 'Enter') {
          const opt = SETTINGS_OPTS[settingsCursor];
          if (opt.type === 'cycle') settings[opt.key] = (settings[opt.key] + 1) % opt.options.length;
          else { settings[opt.key] = !settings[opt.key]; if (opt.key === 'rainbowTrail') horseTrail = []; }
        }
        if (e.code === 'ArrowLeft') {
          const opt = SETTINGS_OPTS[settingsCursor];
          if (opt.type === 'cycle') settings[opt.key] = (settings[opt.key] - 1 + opt.options.length) % opt.options.length;
        }
        return;
      }

      // If in lobby and not a settings key, return to prevent other actions
      if (phase === 'lobby') return;

      keys[e.code] = true;

      // Start timer on first movement
      if (!timerActive && phase === 'play' && MOVE_KEYS.has(e.code)) {
        startTime = Date.now();
        timerActive = true;
      }

      if (e.code === 'KeyR' && (phase === 'win' || phase === 'dead')) phase = 'lobby';
      if ((e.code === 'Enter' || e.code === 'KeyR') && phase === 'nextlevel') {
        playingLevelIdx++;
        startLevel(playingLevelIdx);
      }
      if ((e.code === 'Enter' || e.code === 'KeyR') && phase === 'secretwin') {
        playingLevelIdx = ALL_LEVELS.length - 1;
        startLevel(playingLevelIdx);
      }
    });

    window.addEventListener('keyup', e => { keys[e.code] = false; });

    // ── touch events ──────────────────────────────────────────
    const activeTouches = {};
    function setupTouch() {
      const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
      if (!isTouch) return;

      const joyBase = document.getElementById('joy-base');
      const joyKnob = document.getElementById('joy-knob');
      const btnJump = document.getElementById('btn-jump');
      const btnStart = document.getElementById('btn-start');
      const btnRestart = document.getElementById('btn-restart');
      const btnSettings = document.getElementById('btn-settings');
      const controls = document.getElementById('controls');
      const mobileInput = document.getElementById('mobile-input');

      // Visibility logic
      const updateVisibility = () => {
        const isLobby = phase === 'lobby';
        const isPlay = phase === 'play';
        const isEnd = phase === 'win' || phase === 'dead';
        const isSettings = phase === 'settings';

        btnStart.style.display = (isLobby && username.trim().length > 0) ? 'flex' : 'none';
        btnRestart.style.display = isEnd ? 'flex' : 'none';
        btnSettings.style.display = (isLobby || isPlay || isSettings) ? 'flex' : 'none';
        controls.style.display = (isPlay && !isEnd) ? 'flex' : 'none';
      };

      // Hook into game loop/phase changes
      const _loop = loop;
      loop = () => {
        updateVisibility();
        _loop();
      };

      // Mobile keyboard / Settings touch handling
      canvas.addEventListener('touchstart', e => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = 800 / rect.width;
        const scaleY = 450 / rect.height;
        const cx = (e.touches[0].clientX - rect.left) * scaleX;
        const cy = (e.touches[0].clientY - rect.top) * scaleY;

        if (phase === 'lobby') {
          if (cy > 330 && cy < 390) {
            mobileInput.focus();
            mobileInput.value = username;
          }
        } else if (phase === 'settings') {
          const menuW = 360, menuH = 260;
          const menuX = 400 - menuW / 2, menuY = 225 - menuH / 2;

          if (cx > menuX && cx < menuX + menuW) {
            SETTINGS_OPTS.forEach((opt, i) => {
              const oy = menuY + 80 + i * 40;
              if (cy > oy - 25 && cy < oy + 10) {
                settingsCursor = i;
                if (opt.type === 'cycle') {
                  settings[opt.key] = (settings[opt.key] + 1) % opt.options.length;
                } else {
                  settings[opt.key] = !settings[opt.key];
                  if (opt.key === 'rainbowTrail') horseTrail = [];
                }
              }
            });
          }
        }
      });
      mobileInput.addEventListener('input', () => {
        username = mobileInput.value.toUpperCase();
      });
      mobileInput.addEventListener('blur', () => {
        mobileInput.value = username;
      });

      btnStart.addEventListener('touchstart', e => {
        e.preventDefault();
        if (username.trim().length > 0) initPlay();
      });

      btnRestart.addEventListener('touchstart', e => {
        e.preventDefault();
        phase = 'lobby';
      });

      btnSettings.addEventListener('touchstart', e => {
        e.preventDefault();
        if (phase === 'settings') {
          phase = settingsPrevPhase;
          if (phase === 'lobby') fetchScores();
        } else {
          settingsPrevPhase = phase;
          phase = 'settings';
        }
      });

      const updateJoystick = (touch) => {
        const rect = joyBase.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const dx = touch.clientX - centerX;
        const maxDist = rect.width / 2 - 25;
        const normX = Math.max(-1, Math.min(1, dx / maxDist));

        joyKnob.style.transform = `translateX(${normX * maxDist}px)`;

        if (normX < -0.3) { keys['ArrowLeft'] = true; keys['ArrowRight'] = false; }
        else if (normX > 0.3) { keys['ArrowRight'] = true; keys['ArrowLeft'] = false; }
        else { keys['ArrowLeft'] = false; keys['ArrowRight'] = false; }

        if (!timerActive && phase === 'play' && Math.abs(normX) > 0.3) {
          startTime = Date.now();
          timerActive = true;
        }
      };

      joyBase.addEventListener('touchstart', e => {
        e.preventDefault();
        for (let t of e.changedTouches) {
          activeTouches[t.identifier] = 'joy';
          updateJoystick(t);
        }
      }, { passive: false });

      joyBase.addEventListener('touchmove', e => {
        e.preventDefault();
        for (let t of e.changedTouches) {
          if (activeTouches[t.identifier] === 'joy') updateJoystick(t);
        }
      }, { passive: false });

      const stopJoy = e => {
        e.preventDefault();
        for (let t of e.changedTouches) {
          if (activeTouches[t.identifier] === 'joy') {
            joyKnob.style.transform = `translateX(0)`;
            keys['ArrowLeft'] = false;
            keys['ArrowRight'] = false;
            delete activeTouches[t.identifier];
          }
        }
      };
      joyBase.addEventListener('touchend', stopJoy, { passive: false });
      joyBase.addEventListener('touchcancel', stopJoy, { passive: false });

      btnJump.addEventListener('touchstart', e => {
        e.preventDefault();
        for (let t of e.changedTouches) activeTouches[t.identifier] = 'jump';
        keys['Space'] = true;
        if (!timerActive && phase === 'play') {
          startTime = Date.now();
          timerActive = true;
        }
      }, { passive: false });

      const stopJump = e => {
        e.preventDefault();
        for (let t of e.changedTouches) {
          if (activeTouches[t.identifier] === 'jump') {
            keys['Space'] = false;
            delete activeTouches[t.identifier];
          }
        }
      };
      btnJump.addEventListener('touchend', stopJump, { passive: false });
      btnJump.addEventListener('touchcancel', stopJump, { passive: false });
    }
    setupTouch();

    // ── update ────────────────────────────────────────────────
    function update() {
      tick++;
      if (phase !== 'play') return;

      const left = keys['ArrowLeft'] || keys['KeyA'];
      const right = keys['ArrowRight'] || keys['KeyD'];
      const jump = keys['ArrowUp'] || keys['KeyW'] || keys['Space'];

      player.vx = right ? SPEED : left ? -SPEED : 0;
      if (player.vx !== 0) player.facing = player.vx > 0 ? 1 : -1;

      if (jump && player.onGround) {
        player.vy = JUMP_VY;
        player.onGround = false;
      }

      player.vy = Math.min(player.vy + GRAVITY, 18);

      // X
      player.x += player.vx;
      player.x = Math.max(0, player.x);
      for (const [px, py, pw, ph] of currentLevel.platforms) {
        if (overlap(player.x, player.y, player.w, player.h, px, py, pw, ph))
          player.x = player.vx > 0 ? px - player.w : px + pw;
      }

      // Y
      player.y += player.vy;
      player.onGround = false;
      for (const [px, py, pw, ph] of currentLevel.platforms) {
        if (overlap(player.x, player.y, player.w, player.h, px, py, pw, ph)) {
          if (player.vy >= 0) { player.y = py - player.h; player.vy = 0; player.onGround = true; }
          else { player.y = py + ph; player.vy = 0; }
        }
      }

      // Coins
      for (const c of COINS) {
        if (!c.collected &&
          overlap(player.x, player.y, player.w, player.h, c.x - c.r, c.y - c.r, c.r * 2, c.r * 2)) {
          c.collected = true;
          score += 10;
        }
      }

      // Iframes
      if (player.iframes > 0) player.iframes--;

      // Enemies
      for (const e of enemies) {
        if (e.dead) {
          if (settings.enemyRespawn) {
            if (--e.respawnIn <= 0) { e.dead = false; e.x = e.startX; }
          }
          continue;
        }
        const p = currentLevel.platforms[e.platIdx];
        e.x += e.vx;
        if (e.x <= p[0] || e.x + e.w >= p[0] + p[2]) {
          e.vx = -e.vx;
          e.x = Math.max(p[0], Math.min(e.x, p[0] + p[2] - e.w));
        }
        if (overlap(player.x, player.y, player.w, player.h, e.x, e.y, e.w, e.h)) {
          // Stomp: player falling and feet above enemy midpoint
          if (player.vy > 1 && player.y + player.h < e.y + e.h * 0.6) {
            e.dead = true;
            e.respawnIn = 60;
            player.vy = -6;
            score += 5; // 5 pts per squish
          } else {
            hurtPlayer(e);
          }
        }
      }

      // Win / fall
      if (player.x + player.w > GOAL.x && player.y < GOAL.y + GOAL.poleH) {
        winLevel(false);
      }
      if (player.y > cameraY + H + 80) killPlayer();

      // Camera
      cameraX += (player.x - W * 0.3 - cameraX) * 0.12;
      cameraX = Math.max(0, cameraX);
      cameraY += (player.y - H * 0.5 - cameraY) * 0.12;
      cameraY = Math.max(-200, cameraY); // don't scroll above world top
    }

    // ── background helpers ────────────────────────────────────
    function drawGrid() {
      ctx.save();
      ctx.strokeStyle = 'rgba(120,0,255,0.15)';
      ctx.lineWidth = 1;
      const gs = 50;
      const ox = (-cameraX % gs + gs) % gs;
      const oy = (-cameraY % gs + gs) % gs;
      for (let x = ox; x < W; x += gs) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = oy; y < H; y += gs) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
      ctx.restore();
    }

    function drawHorizonGlow() {
      const grad = ctx.createLinearGradient(0, H * 0.55, 0, H);
      grad.addColorStop(0, 'rgba(80,0,200,0)');
      grad.addColorStop(1, 'rgba(80,0,200,0.18)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }

    // ── leaderboard panel ─────────────────────────────────────
    function drawPanel(x, y, w, h, color, title, entries, valueFn) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(x, y, w, h);
      glow(color, 12, () => {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h);
        ctx.fillStyle = color + '22';
        ctx.fillRect(x + 1, y + 1, w - 2, 28);
      });

      ctx.textAlign = 'center';
      ctx.font = 'bold 12px "Courier New", monospace';
      ctx.fillStyle = color;
      ctx.fillText(title, x + w / 2, y + 19);

      if (entries.length === 0) {
        ctx.font = '11px "Courier New", monospace';
        ctx.fillStyle = 'rgba(200,200,255,0.3)';
        ctx.fillText('— no records yet —', x + w / 2, y + 70);
      } else {
        ctx.font = '12px "Courier New", monospace';
        const shown = entries.slice(0, 7);
        shown.forEach((e, i) => {
          const ry = y + 44 + i * 26;
          const dim = !e.finished;
          ctx.fillStyle = i === 0 && !dim ? '#FFD700' : dim ? 'rgba(160,155,200,0.85)' : 'rgba(220,220,255,0.95)';
          ctx.textAlign = 'left';
          ctx.fillText(`${i + 1}.`, x + 12, ry);
          ctx.fillText(e.name.substring(0, 11), x + 34, ry);
          ctx.textAlign = 'right';
          ctx.fillText(valueFn(e) + (dim ? '*' : ''), x + w - 12, ry);
        });
        if (shown.some(e => !e.finished)) {
          ctx.textAlign = 'left';
          ctx.font = '10px "Courier New", monospace';
          ctx.fillStyle = 'rgba(160,155,200,0.75)';
          ctx.fillText('*unfinished', x + 10, y + h - 7);
        }
      }
      ctx.textAlign = 'left';
    }

    // ── lobby render ──────────────────────────────────────────
    function renderLobby() {
      ctx.fillStyle = '#05000F';
      ctx.fillRect(0, 0, W, H);
      drawGrid();
      drawHorizonGlow();

      // Title
      ctx.textAlign = 'center';
      glow('#FF2D78', 50, () => {
        ctx.font = 'bold 44px "Courier New", monospace';
        ctx.fillStyle = '#FF2D78';
        ctx.fillText('HORSEY CONDITION', W / 2, 76);
      });

      // Leaderboard panels
      const pw = 310, ph = 220, py = 98;
      const isRunBoard = settings.levelIdx === 0;
      const isSecretBoard = settings.levelIdx === ALL_LEVELS.length - 1;
      const lbTitle1 = isRunBoard ? 'FULL RUN · SCORES' : isSecretBoard ? 'SECRET RUN · SCORES' : 'HIGH SCORES';
      const lbTitle2 = isRunBoard ? 'FULL RUN · FASTEST' : isSecretBoard ? 'SECRET RUN · FASTEST' : 'FASTEST TIMES';
      drawPanel(W / 2 - pw - 12, py, pw, ph, '#FF2D78', lbTitle1,
        scores.highScores, e => `${e.score} (${formatTime(e.time).split(':')[1]})`);
      drawPanel(W / 2 + 12, py, pw, ph, '#00FF99', lbTitle2,
        scores.fastTimes, e => `${formatTime(e.time)} (${e.score}pts)`);

      // Username input
      const bx = W / 2 - 155, by = 340, bw = 310, bh = 38;
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(bx, by, bw, bh);
      glow(username.length > 0 ? '#00FFFF' : '#003344', 10, () => {
        ctx.strokeStyle = '#00FFFF';
        ctx.lineWidth = 2;
        ctx.strokeRect(bx, by, bw, bh);
      });

      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.textAlign = 'center';
      if (username.length === 0) {
        ctx.fillStyle = 'rgba(0,255,255,0.3)';
        ctx.fillText('TYPE YOUR NAME', W / 2, by + 25);
      } else {
        ctx.fillStyle = '#00FFFF';
        ctx.fillText(username + (tick % 36 < 18 ? '_' : ' '), W / 2, by + 25);
      }

      ctx.font = '12px "Courier New", monospace';
      ctx.fillStyle = username.trim().length > 0 ? 'rgba(255,215,0,0.85)' : 'rgba(200,200,255,0.35)';
      ctx.fillText(
        username.trim().length === 0 ? 'ENTER A NAME TO PLAY'
          : hasPlayed ? 'PRESS ENTER TO PLAY AGAIN'
            : 'PRESS ENTER TO START',
        W / 2, by + 54
      );

      ctx.font = '11px "Courier New", monospace';
      ctx.fillStyle = 'rgba(180,180,255,0.28)';
      ctx.fillText('A D / ← →  move   ·   W / ↑ / SPACE  jump   ·   R  restart   ·  TAB/ESC settings', W / 2, H - 14);
      ctx.textAlign = 'left';
    }

    // ── game render ───────────────────────────────────────────
    function render() {
      if (phase === 'lobby') { renderLobby(); return; }

      ctx.fillStyle = '#05000F';
      ctx.fillRect(0, 0, W, H);
      drawGrid();
      drawHorizonGlow();

      ctx.save();
      ctx.translate(-Math.round(cameraX), -Math.round(cameraY));

      // Platforms
      for (const [px, py, pw, ph, col] of currentLevel.platforms) {
        ctx.fillStyle = col + '22';
        ctx.fillRect(px, py + 4, pw, ph - 4);
        glow(col, 18, () => {
          ctx.fillStyle = col;
          ctx.fillRect(px, py, pw, 4);
        });
      }

      // Goal Rainbow
      ctx.save();
      ctx.translate(GOAL.x, GOAL.y + GOAL.poleH);
      RAINBOW.forEach((col, i) => {
        const r = 45 + (RAINBOW.length - i) * 6;
        glow(col, 20, () => {
          ctx.strokeStyle = col;
          ctx.lineWidth = 7;
          ctx.beginPath();
          ctx.arc(0, 0, r, Math.PI, 0);
          ctx.stroke();
        });
      });
      ctx.restore();

      // Enemies
      for (const e of enemies) {
        if (e.dead) continue;
        const ex = Math.round(e.x), ey = Math.round(e.y);
        glow('#FF3300', 20, () => {
          ctx.fillStyle = '#FF3300';
          ctx.fillRect(ex, ey, e.w, e.h);
        });
        ctx.fillStyle = 'rgba(255,120,0,0.35)';
        ctx.fillRect(ex + 2, ey + 2, 6, 2);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(ex + 1, ey + 5); ctx.lineTo(ex + 8, ey + 7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ex + 10, ey + 7); ctx.lineTo(ex + 17, ey + 5); ctx.stroke();
        ctx.fillStyle = '#000';
        ctx.fillRect(ex + 3, ey + 8, 4, 4);
        ctx.fillRect(ex + 11, ey + 8, 4, 4);
        ctx.fillStyle = '#FF0000';
        ctx.fillRect(ex + 4, ey + 9, 2, 2);
        ctx.fillRect(ex + 12, ey + 9, 2, 2);
        const ls = Math.sin(tick * 0.25 * Math.sign(e.vx) + e.x * 0.1) * 3;
        ctx.fillStyle = '#CC2200';
        ctx.fillRect(ex + 3, ey + e.h, 4, 5 + ls);
        ctx.fillRect(ex + 11, ey + e.h, 4, 5 - ls);
      }

      // Coins
      for (const c of COINS) {
        if (c.collected) continue;
        const pulse = 0.7 + 0.3 * Math.sin(tick * 0.08 + c.x * 0.05);
        glow('#FFD700', 14 * pulse, () => {
          ctx.fillStyle = `rgba(255,215,0,${pulse})`;
          ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,200,0.6)';
          ctx.beginPath(); ctx.arc(c.x - 2, c.y - 2, 3, 0, Math.PI * 2); ctx.fill();
        });
      }

      // Rainbow trail
      if (settings.rainbowTrail && (player.vx !== 0 || !player.onGround)) {
        horseTrail.push({ x: player.x + player.w / 2, y: player.y + player.h * 0.65, t: tick });
      }
      horseTrail = horseTrail.filter(p => tick - p.t < 28);
      for (const p of horseTrail) {
        const age = tick - p.t;
        const alpha = (1 - age / 28) * 0.75;
        const r = (5 - age * 0.15);
        if (r <= 0) continue;
        const col = RAINBOW[Math.floor(p.t / 3) % 7];
        ctx.globalAlpha = alpha;
        ctx.shadowColor = col; ctx.shadowBlur = 10;
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;

      // Player (flicker during iframes)
      if (phase !== 'dead' && (player.iframes === 0 || tick % 8 < 4)) {
        const px = Math.round(player.x), py = Math.round(player.y);
        const col = '#FF2D78', dark = '#880030', mane = '#FF80B0';
        glow(col, 22, () => {
          ctx.save();
          // Flip horizontally when facing left
          if (player.facing === -1) {
            ctx.translate(px + player.w / 2, 0);
            ctx.scale(-1, 1);
            ctx.translate(-(px + player.w / 2), 0);
          }
          // Body
          ctx.fillStyle = col;
          ctx.fillRect(px, py + 12, 18, 10);
          // Rump
          ctx.fillRect(px, py + 10, 6, 4);
          // Neck
          ctx.fillRect(px + 12, py + 6, 5, 8);
          // Head
          ctx.fillRect(px + 13, py + 2, 7, 8);
          // Snout
          ctx.fillRect(px + 18, py + 5, 4, 5);
          // Nostril
          ctx.fillStyle = dark;
          ctx.fillRect(px + 20, py + 7, 2, 2);
          // Eye
          ctx.fillStyle = '#0a0010';
          ctx.fillRect(px + 15, py + 4, 2, 2);
          // Ear
          ctx.fillStyle = col;
          ctx.fillRect(px + 14, py, 2, 4);
          // Horn (unicorn!)
          if (settings.unicornHorn) {
            const hornCol = RAINBOW[Math.floor(tick / 4) % 7];
            ctx.fillStyle = hornCol;
            ctx.shadowColor = hornCol; ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(px + 14, py + 1);
            ctx.lineTo(px + 19, py + 1);
            ctx.lineTo(px + 17, py - 9);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(px + 15, py - 1); ctx.lineTo(px + 17, py - 5); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(px + 16, py - 5); ctx.lineTo(px + 18, py - 2); ctx.stroke();
          }
          // Mane
          ctx.fillStyle = mane;
          ctx.fillRect(px + 11, py + 4, 2, 10);
          ctx.fillRect(px + 9, py + 8, 2, 6);
          // Tail (animated)
          const tw = Math.sin(tick * 0.12) * 3;
          ctx.fillStyle = col;
          ctx.fillRect(px - 2, py + 11, 3, 5 + tw);
          ctx.fillStyle = mane;
          ctx.fillRect(px - 4, py + 14 + tw, 3, 6);
          // Legs (animated when moving or airborne)
          const ls = (player.vx !== 0 || !player.onGround) ? Math.sin(tick * 0.28) * 4 : 0;
          ctx.fillStyle = col;
          ctx.fillRect(px + 2, py + 21, 4, 5 + ls);
          ctx.fillRect(px + 7, py + 21, 4, 5 - ls);
          ctx.fillRect(px + 11, py + 20, 4, 5 - ls);
          ctx.fillRect(px + 15, py + 20, 4, 5 + ls);
          // Hooves
          ctx.fillStyle = dark;
          ctx.fillRect(px + 2, py + 25 + ls, 4, 3);
          ctx.fillRect(px + 7, py + 25 - ls, 4, 3);
          ctx.fillRect(px + 11, py + 24 - ls, 4, 3);
          ctx.fillRect(px + 15, py + 24 + ls, 4, 3);
          ctx.restore();
        });
      }

      ctx.restore();

      // ── HUD ───────────────────────────────────────────────
      ctx.font = 'bold 15px "Courier New", monospace';

      glow('#FF2D78', 10, () => {
        ctx.fillStyle = '#FF2D78';
        ctx.fillText(`SCORE  ${score}`, 20, 30);
      });

      // Health bar
      const bw = 16, bh = 12, bgap = 4, bx0 = 20, by0 = 42;
      const healthCol = '#FF2D78';
      for (let i = 0; i < 5; i++) {
        const bx = bx0 + i * (bw + bgap);
        if (i < player.hp) {
          glow(healthCol, 8, () => {
            ctx.fillStyle = healthCol;
            ctx.fillRect(bx, by0, bw, bh);
          });
        } else {
          ctx.fillStyle = 'rgba(255,45,120,0.12)';
          ctx.fillRect(bx, by0, bw, bh);
          ctx.strokeStyle = 'rgba(255,45,120,0.3)';
          ctx.lineWidth = 1;
          ctx.strokeRect(bx, by0, bw, bh);
        }
      }

      glow('#FF2D78', 8, () => {
        ctx.fillStyle = '#FF2D78';
        ctx.textAlign = 'right';
        ctx.fillText(username, W - 20, 30);
        ctx.textAlign = 'left';
      });

      if (phase === 'play') {
        glow('#FFD700', 8, () => {
          ctx.font = 'bold 11px "Courier New", monospace';
          ctx.fillStyle = '#FFD700';
          ctx.textAlign = 'center';
          ctx.fillText(currentLevel.name.toUpperCase(), W / 2, 14);

          if (timerActive) {
            ctx.font = 'bold 15px "Courier New", monospace';
            ctx.fillText(formatTime(Date.now() - startTime), W / 2, 32);
          }
          ctx.textAlign = 'left';
        });
      }

      if (!timerActive && phase === 'play') {
        ctx.fillStyle = 'rgba(200,200,255,0.35)';
        ctx.font = '12px "Courier New", monospace';
        ctx.fillText('A D / ← →  move      W / ↑ / SPACE  jump      R  restart', 20, H - 14);
      }

      // ── overlays ──────────────────────────────────────────
      if (phase === 'win' || phase === 'dead') {
        ctx.fillStyle = 'rgba(0,0,0,0.72)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';

        if (phase === 'win') {
          glow('#FFD700', 40, () => {
            ctx.font = 'bold 52px "Courier New", monospace';
            ctx.fillStyle = '#FFD700';
            ctx.fillText('YOU WIN!', W / 2, H / 2 - 52);
          });
          glow('#00FFFF', 14, () => {
            ctx.font = 'bold 18px "Courier New", monospace';
            ctx.fillStyle = '#00FFFF';
            ctx.fillText(`SCORE  ${score}`, W / 2, H / 2 - 8);
          });
          glow('#FFD700', 12, () => {
            ctx.font = 'bold 18px "Courier New", monospace';
            ctx.fillStyle = '#FFD700';
            ctx.fillText(`TIME  ${formatTime(finalTime)}`, W / 2, H / 2 + 24);
          });
          glow('#FF2D78', 8, () => {
            ctx.font = '13px "Courier New", monospace';
            ctx.fillStyle = '#FF2D78';
            ctx.fillText('PRESS  R  TO PLAY AGAIN', W / 2, H / 2 + 62);
          });
        } else {
          glow('#FF2D78', 40, () => {
            ctx.font = 'bold 52px "Courier New", monospace';
            ctx.fillStyle = '#FF2D78';
            ctx.fillText('GAME OVER', W / 2, H / 2 - 30);
          });
          glow('#00FFFF', 8, () => {
            ctx.font = '13px "Courier New", monospace';
            ctx.fillStyle = '#00FFFF';
            ctx.fillText('PRESS  R  TO RETRY', W / 2, H / 2 + 20);
          });
        }
        ctx.textAlign = 'left';
      }
    }

    // ── settings render ──────────────────────────────────────
    function renderSettings() {
      // Draw backdrop (game stays visible if in play)
      if (settingsPrevPhase === 'play') {
        render();
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, W, H);
      } else {
        ctx.fillStyle = '#05000F';
        ctx.fillRect(0, 0, W, H);
        drawGrid();
        drawHorizonGlow();
      }

      const pw = 360, ph = 260;
      const x = W / 2 - pw / 2, y = H / 2 - ph / 2;

      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(x, y, pw, ph);
      glow('#00FFFF', 12, () => {
        ctx.strokeStyle = '#00FFFF';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, pw, ph);
      });

      ctx.textAlign = 'center';
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillStyle = '#00FFFF';
      ctx.fillText('SETTINGS', W / 2, y + 34);

      SETTINGS_OPTS.forEach((opt, i) => {
        const oy = y + 80 + i * 40;
        const sel = i === settingsCursor;
        const val = settings[opt.key];

        if (sel) {
          ctx.fillStyle = 'rgba(0,255,255,0.15)';
          ctx.fillRect(x + 10, oy - 22, pw - 20, 32);
          ctx.fillStyle = '#FFE000';
          ctx.textAlign = 'left';
          ctx.fillText('> ' + opt.label, x + 24, oy);
        } else {
          ctx.fillStyle = 'rgba(200,200,255,0.6)';
          ctx.textAlign = 'left';
          ctx.fillText(opt.label, x + 24, oy);
        }

        ctx.font = 'bold 14px "Courier New", monospace';
        ctx.textAlign = 'right';
        if (opt.type === 'cycle') {
          ctx.fillStyle = '#00FFFF';
          ctx.fillText(sel ? `< ${opt.options[val]} >` : opt.options[val], x + pw - 24, oy);
        } else {
          ctx.fillStyle = val ? '#00FF99' : '#FF2D78';
          ctx.fillText(val ? 'ON' : 'OFF', x + pw - 24, oy);
        }
        ctx.textAlign = 'center';
        ctx.font = 'bold 18px "Courier New", monospace';
      });

      ctx.font = '11px "Courier New", monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillText('↑↓ navigate  ·  ←→ / ENTER cycle  ·  SPACE/ENTER toggle', W / 2, y + ph - 30);
      ctx.fillText('ESC / TAB to return', W / 2, y + ph - 14);
      ctx.textAlign = 'left';
    }

    // ── next level screen ─────────────────────────────────────
    function renderNextLevel() {
      ctx.fillStyle = 'rgba(0,0,0,0.88)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      glow('#00FF99', 30, () => {
        ctx.font = 'bold 42px "Courier New", monospace';
        ctx.fillStyle = '#00FF99';
        ctx.fillText('LEVEL COMPLETE!', W / 2, H / 2 - 70);
      });
      glow('#FF2D78', 10, () => {
        ctx.font = 'bold 16px "Courier New", monospace';
        ctx.fillStyle = '#FF2D78';
        ctx.fillText(currentLevel.name.toUpperCase(), W / 2, H / 2 - 26);
      });
      glow('#00FFFF', 10, () => {
        ctx.font = 'bold 16px "Courier New", monospace';
        ctx.fillStyle = '#00FFFF';
        ctx.fillText(`SCORE  ${score}`, W / 2, H / 2 + 8);
      });
      glow('#FFD700', 10, () => {
        ctx.font = 'bold 16px "Courier New", monospace';
        ctx.fillStyle = '#FFD700';
        ctx.fillText(`TIME  ${formatTime(finalTime)}`, W / 2, H / 2 + 36);
      });
      const nextLevel = ALL_LEVELS[playingLevelIdx + 1];
      if (nextLevel) {
        glow('#FF2D78', 8, () => {
          ctx.font = '13px "Courier New", monospace';
          ctx.fillStyle = 'rgba(200,200,255,0.7)';
          ctx.fillText(`NEXT: ${nextLevel.name.toUpperCase()}`, W / 2, H / 2 + 72);
          ctx.fillStyle = '#FF2D78';
          ctx.fillText('PRESS  ENTER  TO CONTINUE', W / 2, H / 2 + 96);
        });
      }
      ctx.textAlign = 'left';
    }

    // ── secret win screen ─────────────────────────────────────
    function renderSecretWin() {
      ctx.fillStyle = 'rgba(0,5,0,0.92)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      glow('#00FF99', 60, () => {
        ctx.font = 'bold 34px "Courier New", monospace';
        ctx.fillStyle = tick % 40 < 20 ? '#00FF99' : '#00CC77';
        ctx.fillText('!! SECRET EXIT FOUND !!', W / 2, H / 2 - 50);
      });
      glow('#FFD700', 20, () => {
        ctx.font = 'bold 20px "Courier New", monospace';
        ctx.fillStyle = '#FFD700';
        ctx.fillText('THE SECRET WORLD AWAITS...', W / 2, H / 2 + 4);
      });
      glow('#FF2D78', 8, () => {
        ctx.font = '13px "Courier New", monospace';
        ctx.fillStyle = '#FF2D78';
        ctx.fillText('PRESS  ENTER  TO CONTINUE', W / 2, H / 2 + 52);
      });
      ctx.textAlign = 'left';
    }

    // ── loop ──────────────────────────────────────────────────
    function loop() {
      if (phase === 'settings') {
        renderSettings();
      } else if (phase === 'nextlevel') {
        tick++;
        renderNextLevel();
      } else if (phase === 'secretwin') {
        tick++;
        renderSecretWin();
      } else {
        update();
        render();
      }
      requestAnimationFrame(loop);
    }

    // ── startup ───────────────────────────────────────────────
    fetchScores().then(() => {
      phase = 'lobby';
      tick = 0;
      loop();
    });
  </script>
</body>
